<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GCSE Revision Notebook</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="home-button" href="/" aria-current="page">Home</a>
      <div>
        <p class="eyebrow">Revision for GCSE</p>
        <h1>GCSE Revision Notebook</h1>
      </div>
      <a class="logout-link" href="/logout">Log out</a>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <h2>Pick a game and start playing.</h2>
          <p>Quick classics, puzzle challenges, word games, and a quiz, all designed to be simple, and clean.</p>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="tile tile-a"></div>
          <div class="tile tile-b"></div>
          <div class="tile tile-c"></div>
          <div class="tile tile-d"></div>
          <div class="tile tile-e"></div>
          <div class="tile tile-f"></div>
        </div>
      </section>

      <section class="catalog-section" aria-labelledby="catalog-title">
        <h2 id="catalog-title">Game Catalog</h2>
        <div id="game-grid" class="game-grid"></div>
      </section>
    </main>

    <script src="/assets/games-data.js?v=flappy-bird"></script>
    <script src="/assets/main.js?v=flappy-bird"></script>
  </body>
</html>
