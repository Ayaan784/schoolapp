<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Friend Games Hub</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <h1 id="login-title">Friend Games Hub</h1>
        <p>Enter the shared password to open the games catalog.</p>
        <form id="login-form" class="login-form">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Enter Hub</button>
          <p id="login-message" class="form-message" role="status"></p>
        </form>
      </section>
    </main>
    <script src="/assets/login.js"></script>
  </body>
</html>
